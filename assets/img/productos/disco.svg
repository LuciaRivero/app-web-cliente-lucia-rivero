<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Imagen de reemplazo para discos sin imagen (o cuya imagen no
       carga): tapa con ondas y el vinilo asomando, sin texto. -->
  <defs>
    <clipPath id="tapa">
      <rect x="70" y="120" width="500" height="500" />
    </clipPath>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="#1a1a1a" />
  <!-- Vinilo -->
  <g transform="translate(555 400)">
    <circle r="230" fill="#111" />
    <g fill="none" stroke="#2a2a2a" stroke-width="2">
      <circle r="212" />
      <circle r="194" />
      <circle r="176" />
      <circle r="158" />
      <circle r="140" />
      <circle r="122" />
      <circle r="104" />
    </g>
    <circle r="62" fill="#c6f135" />
    <circle r="8" fill="#0a0a0a" />
  </g>
  <!-- Tapa -->
  <rect x="70" y="120" width="500" height="500" fill="#0a0a0a" filter="url(#sombra)" />
  <g clip-path="url(#tapa)" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 145C60 200 40 215 90 265L160 330C190 365 160 395 120 430" stroke="#c6f135" />
    <path d="M150 145C90 200 70 215 120 265L190 330C220 365 190 395 150 430" stroke="#f4f1ea" />
    <path d="M180 145C120 200 100 215 150 265L220 330C250 365 220 395 180 430" stroke="#8b5cf6" />
    <path d="M210 145C150 200 130 215 180 265L250 330C280 365 250 395 210 430" stroke="#f4f1ea" />
  </g>
</svg>
