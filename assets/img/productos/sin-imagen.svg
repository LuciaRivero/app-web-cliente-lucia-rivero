<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Imagen de reemplazo para productos sin imagen (o cuya imagen
       no carga): el disco del favicon apagado, sobre el fondo del sitio. -->
  <rect width="400" height="400" fill="#1a1a1a" />
  <g transform="translate(200 180)">
    <circle r="110" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="4" />
    <!-- Surcos -->
    <g fill="none" stroke="#2a2a2a" stroke-width="3">
      <circle r="92" />
      <circle r="78" />
      <circle r="64" />
    </g>
    <!-- Etiqueta -->
    <circle r="42" fill="#2a2a2a" stroke="#3f3f46" stroke-width="3" />
    <circle r="10" fill="#a8a29e" />
  </g>
  <text x="200" y="345" fill="#a8a29e" font-family="Inter, Helvetica, Arial, sans-serif"
    font-size="24" font-weight="600" text-anchor="middle">Sin imagen</text>
</svg>
