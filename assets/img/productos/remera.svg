<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Imagen de reemplazo para remeras sin imagen (o cuya imagen no
       carga): remera negra con las ondas de la tapa del disco, sin texto. -->
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="#1a1a1a" />
  <!-- Remera -->
  <path
    d="M318 150Q400 205 482 150L640 215L700 350L600 392L580 360V650H220V360L200 392L100 350L160 215Z"
    fill="#0a0a0a" stroke="#2a2a2a" stroke-width="4" stroke-linejoin="round" filter="url(#sombra)" />
  <path d="M318 150Q400 205 482 150" fill="none" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round" />
  <!-- Estampa: las ondas del disco -->
  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M370 300C325 340 310 352 348 390L400 438C423 465 400 488 370 515" stroke="#c6f135" />
    <path d="M396 300C351 340 336 352 374 390L426 438C449 465 426 488 396 515" stroke="#f4f1ea" />
    <path d="M422 300C377 340 362 352 400 390L452 438C475 465 452 488 422 515" stroke="#8b5cf6" />
    <path d="M448 300C403 340 388 352 426 390L478 438C501 465 478 488 448 515" stroke="#f4f1ea" />
  </g>
</svg>
