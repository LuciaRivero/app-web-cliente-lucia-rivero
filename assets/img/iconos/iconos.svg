<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Íconos reutilizables. Se usan con <use href="iconos.svg#id" />.
       El tacho va en dos partes para que el CSS pueda girar la tapa
       (.tapa-eliminar) al pasar el mouse. El color sale de currentColor. -->
