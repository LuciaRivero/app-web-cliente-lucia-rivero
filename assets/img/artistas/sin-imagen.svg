<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Imagen de reemplazo para artistas sin imagen (o cuya imagen
       no carga): un micrófono apagado, con los colores del sitio. -->
  <rect width="400" height="400" fill="#1a1a1a" />
  <g fill="none" stroke="#3f3f46" stroke-width="12" stroke-linecap="round">
    <!-- Soporte -->
    <path d="M130 170a70 70 0 0 0 140 0M200 240v50M160 290h80" />
  </g>
  <!-- Cápsula -->
  <rect x="160" y="70" width="80" height="140" rx="40" fill="#2a2a2a" stroke="#3f3f46" stroke-width="6" />
  <g stroke="#3f3f46" stroke-width="4">
    <path d="M175 110h50M175 135h50M175 160h50" />
  </g>
  <text x="200" y="350" fill="#a8a29e" font-family="Inter, Helvetica, Arial, sans-serif"
    font-size="24" font-weight="600" text-anchor="middle">Sin imagen</text>
</svg>
