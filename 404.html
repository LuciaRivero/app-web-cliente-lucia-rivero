<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Whiplash - La página que buscás no existe o se mudó."
    />
    <title>Whiplash | Página no encontrada</title>
    <!-- GitHub Pages muestra esta página para cualquier dirección que no
         exista, aunque esté dentro de carpetas (por ejemplo /pages/x/y).
         Para que las rutas relativas sigan funcionando, se fija la raíz
         del sitio antes de cargar los estilos. Con esa raíz, el enlace
         "#contenido-principal" apuntaría a la home, así que se corrige. -->
    <script>
      if (location.hostname.endsWith("github.io")) {
        const base = document.createElement("base");
        base.href = "/app-web-cliente-lucia-rivero/";
        document.head.append(base);

        document.addEventListener("DOMContentLoaded", () => {
          const saltar = document.querySelector(".enlace-saltar");
          saltar.href = location.pathname + "#contenido-principal";
        });
      }
    </script>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/paginas/404.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="enlace-saltar" href="#contenido-principal">Saltar al contenido</a>

    <site-header></site-header>

    <main id="contenido-principal">
      <section class="pagina-404" aria-labelledby="titulo-404">
        <div class="tele-404" aria-hidden="true">
          <div class="tele">
            <div class="antena">
              <div class="antena-sombra"></div>
              <div class="varilla-1"></div>
              <div class="punta-1"></div>
              <div class="varilla-2"></div>
              <div class="punta-2"></div>
            </div>
            <div class="tele-caja">
              <svg class="curva-svg" viewBox="0 0 189.929 189.929">
                <path
                  d="M70.343,70.343c-30.554,30.553-44.806,72.7-39.102,115.635l-29.738,3.951C-5.442,137.659,11.917,86.34,49.129,49.13C86.34,11.918,137.664-5.445,189.928,1.502l-3.95,29.738C143.041,25.54,100.895,39.789,70.343,70.343z"
                />
              </svg>
              <div class="pantalla-marco">
                <div class="pantalla-borde">
                  <div class="pantalla-interior">
                    <div class="pantalla">
                      <span class="pantalla-texto">SIN SEÑAL</span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="rayas">
                <div class="raya-1"></div>
                <div class="raya-2"></div>
                <div class="raya-3"></div>
              </div>
              <div class="panel">
                <div class="perilla-1"><div></div></div>
                <div class="perilla-2"></div>
                <div class="parlante">
                  <div class="parlante-agujeros">
                    <div class="agujero"></div>

                    <div class="agujero"></div>
                  </div>
                  <div class="parlante-linea"></div>
                  <div class="parlante-linea"></div>
                </div>
              </div>
            </div>
            <div class="patas">
              <div class="pata"></div>
              <div class="pata"></div>
              <div class="piso"></div>
            </div>
          </div>
          <div class="numero-404">
            <div class="digito">4</div>
            <div class="digito">0</div>
            <div class="digito">4</div>
          </div>
        </div>

        <h1 id="titulo-404">Página no encontrada</h1>
        <p>
          Este tema no está en la lista: la página que buscás no existe o se
          mudó. Volvé al inicio o seguí descubriendo artistas.
        </p>
        <div class="acciones-404">
          <a class="boton" href="index.html">Volver al inicio</a>
          <a class="boton boton-contorno" href="pages/explorar.html">Explorar artistas</a>
        </div>
      </section>
    </main>

    <site-footer></site-footer>
  </body>
</html>
