<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Merch de tus artistas favoritos en Whiplash - Discos, entradas y más directo del creador."
    />
    <title>Merch | Whiplash</title>
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
    <!-- Precarga: fuentes y módulos compartidos se piden en paralelo
         en vez de esperar a que los descubra main.css / main.js. -->
    <link rel="preload" href="../assets/fuentes/anton-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../assets/fuentes/inter-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="modulepreload" href="../js/servicios/datos.js" />
    <link rel="modulepreload" href="../js/utilidades/dom.js" />
    <link rel="modulepreload" href="../js/componentes/navigation.js" />
    <link rel="modulepreload" href="../js/componentes/tarjetas.js" />
    <link rel="modulepreload" href="../js/componentes/data-grid.js" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/paginas/merch.css" />
    <script type="module" src="../js/main.js"></script>
  </head>
  <body>
    <a class="enlace-saltar" href="#contenido-principal">Saltar al contenido</a>

    <site-header current="merch"></site-header>

    <main id="contenido-principal">
      <site-breadcrumbs><span>Merch</span></site-breadcrumbs>

      <h1>Merch</h1>
      <p class="subtitulo">
        Discos, entradas y más, directo de tus artistas favoritos.
      </p>

      <section class="barra-filtros" aria-label="Filtros de merch">
        <div>
          <span class="info-filtro">Tipo de producto</span>
          <div class="grupo-filtros">
            <button type="button" class="chip-genero" aria-pressed="true">
              Todos
            </button>
            <button type="button" class="chip-genero" aria-pressed="false">
              Discos
            </button>
            <button type="button" class="chip-genero" aria-pressed="false">
              Entradas
            </button>
            <button type="button" class="chip-genero" aria-pressed="false">
              Remeras
            </button>
          </div>
        </div>
      </section>

      <p class="info-resultados">Mostrando 6 productos</p>

      <section class="catalogo-merch" aria-labelledby="titulo-catalogo">
        <h2 id="titulo-catalogo" class="sr-only">Catálogo de merch</h2>

        <product-grid limit="6" with-purchase></product-grid>
      </section>

      <a class="boton boton-contorno boton-inferior" href="merch.html">Ver más merch</a>
    </main>

    <site-footer></site-footer>
  </body>
</html>
