<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Registro en Whiplash - Creá tu cuenta para guardar artistas y comprar merch."
    />
    <title>Registro | Whiplash</title>
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
    <!-- Precarga: fuentes y módulos compartidos se piden en paralelo
         en vez de esperar a que los descubra main.css / main.js. -->
    <link rel="preload" href="../assets/fuentes/anton-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../assets/fuentes/inter-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="modulepreload" href="../js/servicios/datos.js" />
    <link rel="modulepreload" href="../js/utilidades/dom.js" />
    <link rel="modulepreload" href="../js/componentes/navigation.js" />
    <link rel="modulepreload" href="../js/componentes/tarjetas.js" />
    <link rel="modulepreload" href="../js/componentes/data-grid.js" />
    <link rel="modulepreload" href="../js/servicios/sesion.js" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/paginas/cuenta.css" />
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/paginas/registro.js"></script>
  </head>
  <body>
    <a class="enlace-saltar" href="#contenido-principal">Saltar al contenido</a>

    <site-header current="cuenta"></site-header>

    <main id="contenido-principal">
      <site-breadcrumbs><a href="cuenta.html">Mi cuenta</a><span>Registro</span></site-breadcrumbs>

      <h1>Creá tu cuenta</h1>
      <p class="subtitulo">
        Registrate para guardar artistas, seguir tus favoritos y comprar merch.
      </p>

      <section class="cuenta-panel" aria-labelledby="titulo-registro">
        <article class="formulario-cuenta">
          <h2 id="titulo-registro">Tus datos</h2>

          <form class="formulario-registro">
            <div class="campo">
              <label for="reg-nombre">Nombre</label>
              <input
                type="text"
                id="reg-nombre"
                name="nombre"
                placeholder="Tu nombre"
                autocomplete="name"
                required
              />
            </div>

            <div class="campo">
              <label for="reg-email">Correo electrónico</label>
              <input
                type="email"
                id="reg-email"
                name="email"
                placeholder="tucorreo@ejemplo.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="campo">
              <label for="reg-password">Contraseña</label>
              <input
                type="password"
                id="reg-password"
                name="password"
                placeholder="Mínimo 8 caracteres"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>

            <div class="campo">
              <label for="reg-password2">Repetí tu contraseña</label>
              <input
                type="password"
                id="reg-password2"
                name="password2"
                placeholder="Repetí tu contraseña"
                autocomplete="new-password"
                required
              />
            </div>

            <div class="consentimiento">
              <input
                type="checkbox"
                id="acepta-terminos"
                name="acepta-terminos"
                required
              />
              <label for="acepta-terminos"
                >Acepto los <a href="terminos.html">términos y condiciones</a> y
                el tratamiento de mis datos personales.</label
              >
            </div>

            <button type="submit">Crear cuenta</button>
          </form>

          <p class="mensaje-formulario" aria-live="polite"></p>

          <p class="cuenta-alternativa">
            ¿Ya tenés cuenta? <a href="cuenta.html">Ingresá</a>
          </p>
        </article>
      </section>

      <promo-banner
        heading="¿Sos artista?"
        text="Postulate y cobrá por cada reproducción de tu música."
        href="nosotros.html"
        link-text="Trabajá con nosotros"
      ></promo-banner>
    </main>

    <site-footer></site-footer>
  </body>
</html>
