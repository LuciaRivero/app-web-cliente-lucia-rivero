<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mi cuenta en Whiplash - Ingresá o creá tu cuenta para guardar artistas y comprar merch."
    />
    <title>Mi cuenta | Whiplash</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/paginas/cuenta.css" />
    <script type="module" src="../js/main.js"></script>
  </head>
  <body>
    <a class="enlace-saltar" href="#contenido-principal">Saltar al contenido</a>

    <site-header current="cuenta"></site-header>

    <main id="contenido-principal">
      <site-breadcrumbs><span>Mi cuenta</span></site-breadcrumbs>

      <h1>Mi cuenta</h1>
      <p class="subtitulo">
        Ingresá o creá tu cuenta para guardar artistas, seguir tus favoritos y
        comprar merch.
      </p>

      <section class="cuenta-grid" aria-labelledby="titulo-cuenta">
        <h2 id="titulo-cuenta" class="sr-only">Acceso a tu cuenta</h2>

        <article class="formulario-cuenta" aria-labelledby="titulo-ingreso">
          <h2 id="titulo-ingreso">Ingresá a tu cuenta</h2>

          <form action="#" method="post">
            <div class="campo">
              <label for="login-email">Correo electrónico</label>
              <input
                type="email"
                id="login-email"
                name="email"
                placeholder="tucorreo@ejemplo.com"
                required
              />
            </div>

            <div class="campo">
              <label for="login-password">Contraseña</label>
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="Tu contraseña"
                required
              />
            </div>

            <a class="enlace-olvido" href="registro.html"
              >¿Olvidaste tu contraseña?</a
            >

            <button type="submit">Ingresar</button>
          </form>
        </article>

        <article class="formulario-cuenta" aria-labelledby="titulo-registro">
          <h2 id="titulo-registro">Creá tu cuenta</h2>

          <form action="#" method="post">
            <div class="campo">
              <label for="reg-nombre">Nombre</label>
              <input
                type="text"
                id="reg-nombre"
                name="nombre"
                placeholder="Tu nombre"
                required
              />
            </div>

            <div class="campo">
              <label for="reg-email">Correo electrónico</label>
              <input
                type="email"
                id="reg-email"
                name="email"
                placeholder="tucorreo@ejemplo.com"
                required
              />
            </div>

            <div class="campo">
              <label for="reg-password">Contraseña</label>
              <input
                type="password"
                id="reg-password"
                name="password"
                placeholder="Mínimo 8 caracteres"
                required
              />
            </div>

            <div class="campo">
              <label for="reg-password2">Repetí tu contraseña</label>
              <input
                type="password"
                id="reg-password2"
                name="password2"
                placeholder="Repetí tu contraseña"
                required
              />
            </div>

            <div class="consentimiento">
              <input
                type="checkbox"
                id="acepta-terminos"
                name="acepta-terminos"
                required
              />
              <label for="acepta-terminos"
                >Acepto los <a href="terminos.html">términos y condiciones</a> y
                el tratamiento de mis datos personales.</label
              >
            </div>

            <button type="submit">Crear cuenta</button>
          </form>
        </article>
      </section>

      <promo-banner
        heading="¿Sos artista?"
        text="Postulate y cobrá por cada reproducción de tu música."
        href="nosotros.html"
        link-text="Trabajá con nosotros"
      ></promo-banner>
    </main>

    <site-footer></site-footer>
  </body>
</html>
