<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mis artistas guardados en Whiplash - Música independiente y merch"
    />
    <title>Mis artistas | Whiplash</title>
    <!-- Precarga: fuentes y módulos compartidos se piden en paralelo
         en vez de esperar a que los descubra main.css / main.js. -->
    <link rel="preload" href="../assets/fuentes/anton-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../assets/fuentes/inter-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="modulepreload" href="../js/servicios/datos.js" />
    <link rel="modulepreload" href="../js/utilidades/dom.js" />
    <link rel="modulepreload" href="../js/componentes/navigation.js" />
    <link rel="modulepreload" href="../js/componentes/tarjetas.js" />
    <link rel="modulepreload" href="../js/componentes/data-grid.js" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/paginas/artistas.css" />
    <script type="module" src="../js/main.js"></script>
  </head>
  <body>
    <a class="enlace-saltar" href="#contenido-principal">Saltar al contenido</a>

    <site-header current="artistas"></site-header>

    <main id="contenido-principal">
      <site-breadcrumbs><span>Mis artistas</span></site-breadcrumbs>

      <h1>Mis artistas</h1>
      <p class="subtitulo">Las joyas que guardaste para volver a escuchar.</p>

      <section class="mis-artistas" aria-labelledby="titulo-mis-artistas">
        <h2 id="titulo-mis-artistas" class="sr-only">
          Lista de artistas guardados
        </h2>

        <ul class="lista-artistas">
          <li class="artista-guardado">
            <a href="producto.html" class="artista-guardado-enlace">
              <img
                class="avatar"
                src="../assets/img/artistas/artista1.jpg"
                alt="Avatar de Los Cráteres"
              />
              <span class="artista-guardado-nombre">Los Cráteres</span>
              <span class="artista-guardado-genero">Rock independiente</span>
            </a>
            <button
              type="button"
              class="quitar"
              aria-label="Quitar a Los Cráteres de mis artistas"
            >
              Quitar
            </button>
          </li>

          <li class="artista-guardado">
            <a href="producto.html" class="artista-guardado-enlace">
              <img
                class="avatar"
                src="../assets/img/artistas/artista2.jpg"
                alt="Avatar de Marea Onda"
              />
              <span class="artista-guardado-nombre">Marea Onda</span>
              <span class="artista-guardado-genero">Folk indie</span>
            </a>
            <button
              type="button"
              class="quitar"
              aria-label="Quitar a Marea Onda de mis artistas"
            >
              Quitar
            </button>
          </li>

          <li class="artista-guardado">
            <a href="producto.html" class="artista-guardado-enlace">
              <img
                class="avatar"
                src="../assets/img/artistas/artista3.jpg"
                alt="Avatar de Valle Silente"
              />
              <span class="artista-guardado-nombre">Valle Silente</span>
              <span class="artista-guardado-genero">Electrónica cruda</span>
            </a>
            <button
              type="button"
              class="quitar"
              aria-label="Quitar a Valle Silente de mis artistas"
            >
              Quitar
            </button>
          </li>
        </ul>

        <a class="boton boton-contorno boton-inferior" href="explorar.html"
          >Seguir explorando</a
        >
      </section>

      <promo-banner
        heading="Comprá el merch de tus artistas"
        text="Discos y entradas directo del creador, sin intermediarios."
        href="merch.html"
        link-text="Ver merch"
      ></promo-banner>
    </main>

    <site-footer></site-footer>
  </body>
</html>
