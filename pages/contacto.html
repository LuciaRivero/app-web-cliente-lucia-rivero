<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contactate con Whiplash - Música independiente"
    />
    <title>Contacto | Whiplash</title>
    <!-- Precarga: fuentes y módulos compartidos se piden en paralelo
         en vez de esperar a que los descubra main.css / main.js. -->
    <link rel="preload" href="../assets/fuentes/anton-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../assets/fuentes/inter-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="modulepreload" href="../js/servicios/datos.js" />
    <link rel="modulepreload" href="../js/utilidades/dom.js" />
    <link rel="modulepreload" href="../js/componentes/navigation.js" />
    <link rel="modulepreload" href="../js/componentes/tarjetas.js" />
    <link rel="modulepreload" href="../js/componentes/data-grid.js" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/paginas/contacto.css" />
    <script type="module" src="../js/main.js"></script>
  </head>
  <body>
    <a class="enlace-saltar" href="#contenido-principal">Saltar al contenido</a>

    <site-header></site-header>

    <main id="contenido-principal">
      <site-breadcrumbs><span>Contacto</span></site-breadcrumbs>

      <h1>Contacto</h1>

      <section class="contacto-info" aria-labelledby="titulo-info">
        <h2 id="titulo-info">Información de contacto</h2>
        <address>
          <p><strong>Whiplash</strong></p>
          <p>Av. Ejemplo 123, Buenos Aires, Argentina</p>
          <p><a href="tel:+5401112345678">+54 11 1234-5678</a></p>
          <p><a href="mailto:hola@whiplash.com">hola@whiplash.com</a></p>
        </address>
      </section>

      <section class="contacto-formulario" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario">Envianos tu consulta</h2>

        <form action="#" method="post">
          <div class="campo">
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Tu nombre"
              required
            />
          </div>

          <div class="campo">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="tucorreo@ejemplo.com"
              required
            />
          </div>

          <div class="campo">
            <label for="asunto">Motivo</label>
            <select id="asunto" name="asunto">
              <option>Quiero publicar mi música</option>
              <option>Reportar un problema</option>
              <option>Propuesta de artista</option>
              <option>Otro</option>
            </select>
          </div>

          <div class="campo">
            <label for="mensaje">Mensaje</label>
            <textarea
              id="mensaje"
              name="mensaje"
              rows="6"
              placeholder="Escribí tu consulta aquí..."
              required
            ></textarea>
          </div>

          <button type="submit">Enviar mensaje</button>
        </form>
      </section>
    </main>

    <site-footer></site-footer>
  </body>
</html>
