<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mi cuenta en Whiplash - Ingresá a tu cuenta o editá tus datos."
    />
    <title>Mi cuenta | Whiplash</title>
    <!-- Precarga: fuentes y módulos compartidos se piden en paralelo
         en vez de esperar a que los descubra main.css / main.js. -->
    <link
      rel="preload"
      href="../assets/fuentes/anton-regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="../assets/fuentes/inter-variable.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="modulepreload" href="../js/servicios/datos.js" />
    <link rel="modulepreload" href="../js/utilidades/dom.js" />
    <link rel="modulepreload" href="../js/componentes/navigation.js" />
    <link rel="modulepreload" href="../js/componentes/tarjetas.js" />
    <link rel="modulepreload" href="../js/componentes/data-grid.js" />
    <link rel="modulepreload" href="../js/servicios/sesion.js" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/paginas/cuenta.css" />
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/paginas/cuenta.js"></script>
  </head>
  <body>
    <a class="enlace-saltar" href="#contenido-principal">Saltar al contenido</a>

    <site-header current="cuenta"></site-header>

    <main id="contenido-principal">
      <site-breadcrumbs><span>Mi cuenta</span></site-breadcrumbs>

      <h1>Mi cuenta</h1>

      <!-- js/paginas/cuenta.js muestra el ingreso o la edición
           según haya una sesión abierta. -->
      <section
        class="cuenta-panel"
        data-vista="ingreso"
        aria-labelledby="titulo-ingreso"
        hidden
      >
        <p class="subtitulo">
          Ingresá para guardar artistas, seguir tus favoritos y comprar merch.
        </p>

        <article class="formulario-cuenta">
          <h2 id="titulo-ingreso">Ingresá a tu cuenta</h2>

          <form class="formulario-ingreso">
            <div class="campo">
              <label for="login-email">Correo electrónico</label>
              <input
                type="email"
                id="login-email"
                name="email"
                placeholder="tucorreo@ejemplo.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="campo">
              <label for="login-password">Contraseña</label>
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="Tu contraseña"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit">Ingresar</button>
          </form>

          <p class="mensaje-formulario" aria-live="polite"></p>

          <p class="cuenta-alternativa">
            ¿No tenés cuenta? <a href="registro.html">Registrate</a>
          </p>
        </article>
      </section>

      <section
        class="cuenta-panel"
        data-vista="edicion"
        aria-labelledby="titulo-edicion"
        hidden
      >
        <p class="subtitulo">
          Hola, <span class="cuenta-nombre"></span>. Acá podés actualizar tus
          datos.
        </p>

        <article class="formulario-cuenta">
          <h2 id="titulo-edicion">Editá tus datos</h2>

          <form class="formulario-edicion">
            <div class="campo">
              <label for="editar-nombre">Nombre</label>
              <input
                type="text"
                id="editar-nombre"
                name="nombre"
                placeholder="Tu nombre"
                autocomplete="name"
                required
              />
            </div>

            <div class="campo">
              <label for="editar-email">Correo electrónico</label>
              <input
                type="email"
                id="editar-email"
                name="email"
                placeholder="tucorreo@ejemplo.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="campo">
              <label for="editar-password">Nueva contraseña</label>
              <input
                type="password"
                id="editar-password"
                name="password"
                placeholder="Dejala vacía para no cambiarla"
                autocomplete="new-password"
                minlength="8"
                aria-describedby="ayuda-password"
              />
              <small id="ayuda-password" class="ayuda-campo"
                >Mínimo 8 caracteres.</small
              >
            </div>

            <div class="campo">
              <label for="editar-password2">Repetí la nueva contraseña</label>
              <input
                type="password"
                id="editar-password2"
                name="password2"
                placeholder="Repetí la nueva contraseña"
                autocomplete="new-password"
              />
            </div>

            <button type="submit">Guardar cambios</button>
          </form>

          <p class="mensaje-formulario" aria-live="polite"></p>
        </article>
      </section>

      <promo-banner
        heading="¿Sos artista?"
        text="Postulate y cobrá por cada reproducción de tu música."
        href="nosotros.html"
        link-text="Trabajá con nosotros"
      ></promo-banner>
    </main>

    <site-footer></site-footer>
  </body>
</html>
