<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mi carrito de merch en Whiplash - Discos y entradas"
    />
    <title>Mi carrito | Whiplash</title>
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
    <!-- Precarga: fuentes y módulos compartidos se piden en paralelo
         en vez de esperar a que los descubra main.css / main.js. -->
    <link rel="preload" href="../assets/fuentes/anton-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../assets/fuentes/inter-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="modulepreload" href="../js/servicios/datos.js" />
    <link rel="modulepreload" href="../js/utilidades/dom.js" />
    <link rel="modulepreload" href="../js/componentes/navigation.js" />
    <link rel="modulepreload" href="../js/componentes/tarjetas.js" />
    <link rel="modulepreload" href="../js/componentes/data-grid.js" />
    <link rel="modulepreload" href="../js/servicios/carrito.js" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/paginas/carrito.css" />
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/paginas/carrito.js"></script>
  </head>
  <body>
    <a class="enlace-saltar" href="#contenido-principal">Saltar al contenido</a>

    <site-header current="carrito"></site-header>

    <main id="contenido-principal">
      <site-breadcrumbs><span>Carrito</span></site-breadcrumbs>

      <h1>Mi carrito</h1>
      <p class="subtitulo">Discos y entradas de tus artistas favoritos.</p>

      <div class="carrito-contenedor">
        <!-- Lista de productos -->
        <section class="carrito-lista" aria-labelledby="titulo-items">
          <h2 id="titulo-items" class="sr-only" tabindex="-1">Productos en el carrito</h2>
          <!-- Los ítems los arma js/paginas/carrito.js desde el carrito guardado. -->
          <div class="carrito-items"></div>
          <p class="sr-only carrito-aviso" aria-live="polite"></p>
        </section>

        <!-- Resumen de compra -->
        <aside class="carrito-resumen" aria-labelledby="titulo-resumen">
          <div>
            <h2 class="resumen-titulo" id="titulo-resumen">Resumen de compra</h2>

            <div class="resumen-fila">
              <span>Subtotal</span>
              <span data-resumen="subtotal">$0</span>
            </div>

            <div class="resumen-fila">
              <span>Envío</span>
              <span data-resumen="envio">$0</span>
            </div>

            <div class="resumen-fila total">
              <span>Total</span>
              <span data-resumen="total">$0</span>
            </div>
          </div>
          <button type="button" class="boton-pagar" disabled>Ir a pagar</button>
        </aside>
      </div>
    </main>

    <site-footer></site-footer>
  </body>
</html>
