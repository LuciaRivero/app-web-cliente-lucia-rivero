<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explorá la música independiente por género en Whiplash - Rock, folk, electrónica y más."
    />
    <title>Géneros | Whiplash</title>
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
    <!-- Precarga: fuentes y módulos compartidos se piden en paralelo
         en vez de esperar a que los descubra main.css / main.js. -->
    <link rel="preload" href="../assets/fuentes/anton-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../assets/fuentes/inter-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="modulepreload" href="../js/servicios/datos.js" />
    <link rel="modulepreload" href="../js/utilidades/dom.js" />
    <link rel="modulepreload" href="../js/componentes/navigation.js" />
    <link rel="modulepreload" href="../js/componentes/tarjetas.js" />
    <link rel="modulepreload" href="../js/componentes/data-grid.js" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/paginas/generos.css" />
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/paginas/generos.js"></script>
  </head>
  <body>
    <a class="enlace-saltar" href="#contenido-principal">Saltar al contenido</a>

    <site-header current="generos"></site-header>

    <main id="contenido-principal">
      <site-breadcrumbs><span>Géneros</span></site-breadcrumbs>

      <h1>Géneros</h1>
      <p class="subtitulo">Elegí un género y entrá de lleno en la escena.</p>

      <section class="barra-filtros" aria-labelledby="titulo-indice">
        <h2 id="titulo-indice" class="sr-only">Índice de géneros</h2>
        <div>
          <span class="info-filtro">Filtrar por género</span>
          <genre-chips filter></genre-chips>
        </div>
      </section>

      <p class="info-resultados" aria-live="polite">Cargando géneros…</p>

      <section class="grilla-generos" aria-labelledby="titulo-todos-generos">
        <h2 id="titulo-todos-generos">Todos los géneros</h2>

        <!-- js/paginas/generos.js arma una .tarjeta-genero por
             cada género de la tabla generos, con sus artistas. -->
      </section>

      <promo-banner
        heading="¿Escuchaste algo que te gustó?"
        text="Guardá tus artistas y volvé cuando quieras."
        href="artistas.html"
        link-text="Ver mis artistas"
      ></promo-banner>
    </main>

    <site-footer></site-footer>
  </body>
</html>
