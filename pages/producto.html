<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Perfil de artista en Whiplash - Música independiente y merch"
    />
    <title>Artista | Whiplash</title>
    <!-- Precarga: fuentes y módulos compartidos se piden en paralelo
         en vez de esperar a que los descubra main.css / main.js. -->
    <link rel="preload" href="../assets/fuentes/anton-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../assets/fuentes/inter-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="modulepreload" href="../js/servicios/datos.js" />
    <link rel="modulepreload" href="../js/utilidades/dom.js" />
    <link rel="modulepreload" href="../js/componentes/navigation.js" />
    <link rel="modulepreload" href="../js/componentes/tarjetas.js" />
    <link rel="modulepreload" href="../js/componentes/data-grid.js" />
    <link rel="modulepreload" href="../js/servicios/sesion.js" />
    <link rel="modulepreload" href="../js/servicios/artistas-seguidos.js" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/paginas/producto.css" />
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/paginas/producto.js"></script>
  </head>
  <body>
    <a class="enlace-saltar" href="#contenido-principal">Saltar al contenido</a>

    <site-header></site-header>

    <main id="contenido-principal">
      <!-- js/paginas/producto.js completa el perfil con el artista
           de ?id= (tabla artistas) y actualiza las migas de pan. -->
      <site-breadcrumbs>
        <a href="generos.html" class="miga-genero">Géneros</a>
        <span>Artista</span>
      </site-breadcrumbs>

      <article class="perfil-artista" aria-busy="true">
        <section class="portada-artista" aria-label="Portada del artista">
          <img src="" alt="" hidden />
        </section>

        <section class="info-artista" aria-labelledby="titulo-artista">
          <h1 id="titulo-artista"></h1>
          <p class="genero-artista"></p>

          <p class="bio-artista"></p>

          <div class="acciones-artista">
            <button type="button" class="boton boton-seguir">Seguir</button>
            <button type="button" class="boton boton-compartir">
              Compartir
            </button>
          </div>
          <p class="aviso-compartir" aria-live="polite"></p>
        </section>

        <section class="tracks" aria-labelledby="titulo-tracks">
          <h2 id="titulo-tracks">Tracks</h2>
          <ul class="lista-tracks"></ul>
        </section>

        <section class="merch-artista" aria-labelledby="titulo-merch">
          <h2 id="titulo-merch">Merch oficial</h2>
          <p class="subtitulo">
            Discos y entradas vendidos directo por el artista.
          </p>
          <!-- Acá va <product-grid artist="id" with-purchase>. -->
        </section>
      </article>

      <section class="artista-no-encontrado" hidden>
        <h1>Artista no encontrado</h1>
        <p class="subtitulo">
          No encontramos ese perfil. Puede que el link esté incompleto.
        </p>
        <a class="boton" href="explorar.html">Explorar artistas</a>
      </section>
    </main>

    <site-footer></site-footer>
  </body>
</html>
