<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explorá la escena independiente en Whiplash - Filtrá por género, ordená y descubrí artistas."
    />
    <title>Explorar | Whiplash</title>
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
    <!-- Precarga: fuentes y módulos compartidos se piden en paralelo
         en vez de esperar a que los descubra main.css / main.js. -->
    <link rel="preload" href="../assets/fuentes/anton-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../assets/fuentes/inter-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="modulepreload" href="../js/servicios/datos.js" />
    <link rel="modulepreload" href="../js/utilidades/dom.js" />
    <link rel="modulepreload" href="../js/componentes/navigation.js" />
    <link rel="modulepreload" href="../js/componentes/tarjetas.js" />
    <link rel="modulepreload" href="../js/componentes/data-grid.js" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/paginas/explorar.css" />
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/paginas/explorar.js"></script>
  </head>
  <body>
    <a class="enlace-saltar" href="#contenido-principal">Saltar al contenido</a>

    <site-header current="explorar"></site-header>

    <main id="contenido-principal">
      <site-breadcrumbs><span>Explorar</span></site-breadcrumbs>

      <h1>Explorar</h1>
      <p class="subtitulo">
        Descubrí la escena independiente y encontrá tu próxima joya.
      </p>

      <section class="barra-filtros" aria-label="Filtros de búsqueda">
        <div>
          <span class="info-filtro">Filtrar por género</span>
          <genre-chips filter limit="4"></genre-chips>
        </div>
      </section>

      <p class="info-resultados">Mostrando 6 artistas</p>

      <section class="explorar-resultados" aria-labelledby="titulo-resultados">
        <h2 id="titulo-resultados" class="sr-only">
          Resultados de exploración
        </h2>

        <artist-grid limit="6"></artist-grid>
      </section>

      <a class="boton boton-contorno boton-inferior" href="explorar.html">Cargar más</a>
    </main>

    <site-footer></site-footer>
  </body>
</html>
